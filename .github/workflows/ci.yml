name: CPU contracts
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.9.0 torchvision==0.24.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-common.lock
      - run: python -m pip install --no-deps .
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m pytest -q -m 'not gpu' -W error
      # Deliberately no GPU pass badge from a CPU-only runner.
